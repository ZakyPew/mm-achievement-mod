# Config file for Majora's Mask Achievement Mod

[manifest]

# Unique mod ID
id = "mm_achievement_mod"

# Version
version = "1.0.0"

# Display name in mod menu
display_name = "MM Achievement System"

# Description
description = """
Achievement system for Majora's Mask: Recompiled.

Track your progress with 40+ achievements across:
- Transformation Masks (Deku, Goron, Zora, Fierce Deity)
- Utility Masks (Keaton, Bunny Hood, Stone Mask, etc.)
- Temple Bosses (Odolwa, Goht, Gyorg, Twinmold)
- Collection (52 Heart Pieces, Stray Fairies)
- Economy (Wallet upgrades, Bank rupees)
- Skulltula Houses

Features rarity tiers, toast notifications, and an achievement menu.
"""

# Short description for mod list
short_description = "Track achievements in Majora's Mask!"

# Authors
authors = [ "Celest" ]

# Target game
game_id = "mm"

# Minimum recomp version
minimum_recomp_version = "1.2.2"

# Dependencies
dependencies = [ ]

# Optional dependencies
optional_dependencies = [ ]

# Native libraries
native_libraries = [ ]

# Config options
[[manifest.config_options]]
id = "show_toast"
name = "Show Toast Notifications"
description = "Display popup when achievements unlock"
type = "Bool"
default = true

[[manifest.config_options]]
id = "toast_duration"
name = "Toast Duration"
description = "How long achievement toasts stay on screen (seconds)"
type = "Number"
min = 2.0
max = 10.0
step = 0.5
precision = 1
percent = false
default = 5.0

# Inputs
[inputs]

# Input elf file
elf_path = "build/mod.elf"

# Output mod filename
mod_filename = "mm_achievement_mod"

# Reference symbol files
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files
additional_files = [ ]
