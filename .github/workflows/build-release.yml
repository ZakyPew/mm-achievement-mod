name: Build and Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip
    
    - name: Create source package
      run: |
        # Create source zip excluding git and other unnecessary files
        zip -r mm-achievement-mod-v1.0.0-source.zip . \
          -x ".git/*" \
          -x ".github/*" \
          -x "*.zip" \
          -x "*.yml" \
          -x "*.txt" || true
    
    - name: Create Thunderstore package
      run: |
        mkdir -p thunderstore_package
        cp thunderstore/manifest.json thunderstore_package/
        cp thunderstore/README.md thunderstore_package/
        
        # Copy icon if it exists
        if [ -f "thunderstore/icon.png" ]; then
          cp thunderstore/icon.png thunderstore_package/
        fi
        
        # Copy source code for users to build
        cp -r src thunderstore_package/
        cp -r include thunderstore_package/
        cp mod.toml thunderstore_package/
        cp Makefile thunderstore_package/
        cp README.md thunderstore_package/BUILD_README.md
        
        # Create zip
        cd thunderstore_package
        zip -r ../mm-achievement-mod-v1.0.0-thunderstore.zip .
        cd ..
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-packages
        path: |
          *.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          mm-achievement-mod-v1.0.0-source.zip
          mm-achievement-mod-v1.0.0-thunderstore.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
