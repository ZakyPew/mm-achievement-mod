name: Build and Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 lld-18 make zip curl
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
    
    - name: Check mm-decomp submodule
      run: |
        ls -la mm-decomp/
        ls -la mm-decomp/include/ 2>/dev/null || echo "No include dir"
    
    - name: Download RecompModTool
      run: |
        curl -L -o RecompModTool \
          "https://github.com/N64Recomp/N64Recomp/releases/download/mod-tool-release/RecompModTool"
        chmod +x RecompModTool
        sudo mv RecompModTool /usr/local/bin/
        RecompModTool --help 2>&1 | head -5 || echo "RecompModTool installed"
    
    - name: Build mod
      run: |
        export CC=clang
        export LD=ld.lld
        make clean 2>/dev/null || true
        make -j$(nproc) 2>&1
    
    - name: Build .nrm file
      run: |
        if [ -f "build/mod.elf" ]; then
          RecompModTool mod.toml build
          ls -la build/
        else
          echo "mod.elf not found - build may have failed"
          exit 1
        fi
    
    - name: Create Thunderstore package
      run: |
        mkdir -p thunderstore_package
        cp thunderstore/manifest.json thunderstore_package/
        cp thunderstore/README.md thunderstore_package/
        
        if [ -f "thunderstore/icon.png" ]; then
          cp thunderstore/icon.png thunderstore_package/
        fi
        
        if [ -f "build/mm_achievement_mod.nrm" ]; then
          cp build/mm_achievement_mod.nrm thunderstore_package/
        fi
        
        cd thunderstore_package
        zip -r ../mm_achievement_mod-thunderstore.zip .
        cd ..
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-packages
        path: |
          build/mm_achievement_mod.nrm
          mm_achievement_mod-thunderstore.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/mm_achievement_mod.nrm
          mm_achievement_mod-thunderstore.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
