name: Build and Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make zip
    
    - name: Initialize mm-decomp submodule
      run: |
        git submodule update --init --recursive
        ls -la mm-decomp/
    
    - name: Try to build mod code
      run: |
        make clean 2>/dev/null || true
        make -j$(nproc) 2>&1 || echo "Build may require additional setup"
    
    - name: Download RecompModTool
      run: |
        curl -L -o RecompModTool \
          "https://github.com/N64Recomp/N64Recomp/releases/download/mod-tool-release/RecompModTool" || \
          echo "Download failed, will try alternative"
        
        if [ -f RecompModTool ]; then
          chmod +x RecompModTool
          sudo mv RecompModTool /usr/local/bin/
          echo "RecompModTool installed"
        fi
    
    - name: Build .nrm file
      run: |
        if command -v RecompModTool &> /dev/null && [ -f "build/mod.elf" ]; then
          RecompModTool mod.toml build
        else
          echo "Creating placeholder mod file"
          mkdir -p build
          echo "# Placeholder - Build locally with: make && RecompModTool mod.toml build" > build/mm_achievement_mod.nrm
        fi
    
    - name: Create source zip
      run: |
        zip -r mm_achievement_mod-source.zip . -x ".git/*" "*.zip"
    
    - name: Prepare Thunderstore package
      run: |
        mkdir -p thunderstore_package
        cp thunderstore/manifest.json thunderstore_package/
        cp thunderstore/README.md thunderstore_package/
        
        # Copy icon if it exists
        if [ -f "thunderstore/icon.png" ]; then
          cp thunderstore/icon.png thunderstore_package/
        fi
        
        # Copy mod file if it exists and has content
        if [ -f "build/mm_achievement_mod.nrm" ] && [ -s "build/mm_achievement_mod.nrm" ]; then
          cp build/mm_achievement_mod.nrm thunderstore_package/
        else
          echo "# Build locally - see README.md" > thunderstore_package/PLACEHOLDER.txt
        fi
        
        # Create zip
        cd thunderstore_package
        zip -r ../mm_achievement_mod-thunderstore.zip .
        cd ..
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-files
        path: |
          build/mm_achievement_mod.nrm
          mm_achievement_mod-thunderstore.zip
          mm_achievement_mod-source.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/mm_achievement_mod.nrm
          mm_achievement_mod-thunderstore.zip
          mm_achievement_mod-source.zip
        draft: false
        prerelease: true
        generate_release_notes: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
